# @package _group_
_target_: trainer.trainer_stage2.InstanceSegmentation # Reusing Stage 2 trainer logic by default
                                                     # Change to trainer.trainer_stage3.InstanceSegmentation if a new trainer class is created

deterministic: false
max_epochs: 50 # Adjust for Stage 3
min_epochs: 1
resume_from_checkpoint: ${general.checkpoint} # This should be set in the main config (e.g., output of Stage 2)
check_val_every_n_epoch: 10 # Adjust validation frequency for Stage 3
num_sanity_val_steps: 2
log_every_n_steps: 5
