# @package data

train_collation:
  _target_: datasets.utils_stage2.VoxelizeCollate # Reusing the same collate class
  ignore_label: ${data.ignore_label} # from indoor_stage3.yaml
  voxel_size: ${data.voxel_size}     # from indoor_stage3.yaml
  mode: ${data.train_mode}           # from indoor_stage3.yaml
  small_crops: false
  very_small_crops: false
  batch_instance: false
  probing: ${general.linear_probing_backbone}
  task: ${general.task}
  ignore_class_threshold: ${general.ignore_class_threshold}
  filter_out_classes: ${data.train_dataset.filter_out_classes} # from scannet_stage3.yaml
  label_offset: ${data.train_dataset.label_offset}             # from scannet_stage3.yaml
  num_queries: ${model.num_queries} # from base model config

  # Path to pseudo-labels (masks, scores, logits) generated by Stage 2
  generate_masks_path: ${data.generate_masks_path} # IMPORTANT: from indoor_stage3.yaml, should point to Stage 2's output

  # Instance selection thresholds from pseudo-labels (before point-wise filtering)
  use_masks_th: ${data.use_masks_th} # Max masks per scene, from indoor_stage3.yaml (or override here)
  use_masks_score: ${data.use_masks_score} # Min instance score, from indoor_stage3.yaml (or override here)

  # Point-wise filtering thresholds for Stage 3
  point_wise_logit_threshold: 0.8 # Example: Higher confidence for Stage 3
  min_points_after_filtering: 50  # Example: Stricter requirement for Stage 3

validation_collation:
  _target_: datasets.utils_stage2.VoxelizeCollate
  ignore_label: ${data.ignore_label}
  voxel_size: ${data.voxel_size}
  mode: ${data.validation_mode}
  batch_instance: false
  probing: ${general.linear_probing_backbone}
  task: ${general.task}
  ignore_class_threshold: ${general.ignore_class_threshold}
  filter_out_classes: ${data.validation_dataset.filter_out_classes}
  label_offset: ${data.validation_dataset.label_offset}
  num_queries: ${model.num_queries}
  generate_masks_path: ${data.generate_masks_path} # For validation, this might point to GT or a fixed set of good pseudo-labels
  use_masks_th: ${data.use_masks_th}
  use_masks_score: ${data.use_masks_score}
  # Point-wise filtering is typically not applied to GT validation data,
  # but params are needed by constructor. Set to non-filtering values or rely on defaults if not used.
  point_wise_logit_threshold: 0.0
  min_points_after_filtering: 0

test_collation:
  _target_: datasets.utils_stage2.VoxelizeCollate
  ignore_label: ${data.ignore_label}
  voxel_size: ${data.voxel_size}
  mode: ${data.test_mode}
  batch_instance: false
  probing: ${general.linear_probing_backbone}
  task: ${general.task}
  ignore_class_threshold: ${general.ignore_class_threshold}
  filter_out_classes: ${data.test_dataset.filter_out_classes}
  label_offset: ${data.test_dataset.label_offset}
  num_queries: ${model.num_queries}
  generate_masks_path: ${data.generate_masks_path} # Similar to validation
  use_masks_th: ${data.use_masks_th}
  use_masks_score: ${data.use_masks_score}
  point_wise_logit_threshold: 0.0
  min_points_after_filtering: 0
