# @package _group_

# these parameters are inherited by datasets, data_loaders and collators
# but they might be overwritten for Stage 3

# splits
train_mode: train
validation_mode: validation
test_mode: validation # test  # validation

# dataset
ignore_label: 255
add_raw_coordinates: true # 3dim
add_colors: true # 3dim
add_normals: false # 3dim
in_channels: 3 # in_channels = 3 * (add_normals + add_colors + add_raw_coordinates)
num_labels: 20 # Corresponds to ScanNet20, adjust if different
add_instance: ${general.add_instance}
task: ${general.task}

# data loader
pin_memory: false
num_workers: 4
batch_size: 5 # Adjust as per Stage 3 requirements/memory
test_batch_size: 1
cache_data: false # Consider true if dataset is static and fits memory for speed

# collation
voxel_size: 0.02 # Keep consistent unless specifically changing resolution

reps_per_epoch: ${general.reps_per_epoch}

cropping: false # Augmentations, can be enabled for Stage 3
cropping_args:
  min_points: 30000
  aspect: 0.8
  min_crop: 0.5
  max_crop: 1.0

crop_min_size: 20000
crop_length: 6.0
cropping_v1: true

remove_small_group: 15 # Threshold for small instance removal during data processing

# Path for pseudo-labels generated by Stage 2 (or previous stage)
# This path will contain masks/, scores/, and logits/ subdirectories
generate_masks_path: "data/processed/scannet_3d_masks_stage2_output" # IMPORTANT: Update this path

# Thresholds for using the pseudo-masks in Stage 3 training (set in collation)
# These are defaults here, but usually overridden in the specific collation config.
# use_masks_th: 150 # Max number of masks to consider from pseudo-labels per scene
# use_masks_score: 0.6 # Min score for an instance from pseudo-labels
# point_wise_logit_threshold: 0.5 # Defined in collation function config
# min_points_after_filtering: 50   # Defined in collation function config
